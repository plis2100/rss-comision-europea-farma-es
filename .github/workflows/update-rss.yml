name: Actualizar RSS Comision Europea

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-comision-europea
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar RSS
        run: |
          python main.py

      - name: Comprobar RSS
        run: |
          test -f feed.xml
          python -c "import xml.etree.ElementTree as ET; tree=ET.parse('feed.xml'); print('Entradas RSS:', len(tree.findall('./channel/item')))"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en la RSS."
          else
            git commit -m "Actualizar RSS Comision Europea"
            git push
          fi
