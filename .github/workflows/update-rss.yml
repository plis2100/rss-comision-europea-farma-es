name: Actualizar RSS Comisión Europea

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions utiliza UTC.
    # Se ejecuta cada hora.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-comision-europea
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar RSS
        run: |
          python main.py

      - name: Comprobar RSS
        run: |
          test -f feed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("feed.xml")
          root = tree.getroot()

          items = root.findall("./channel/item")

          print("Entradas RSS:", len(items))

          for item in items[:10]:
              title = item.findtext("title")
              date = item.findtext("pubDate")
              print(title)
              print("Fecha:", date)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en la RSS."
          else
            git commit -m "Actualizar RSS Comisión Europea"
            git push
          fi
